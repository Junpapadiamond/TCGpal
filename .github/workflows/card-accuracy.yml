name: Card accuracy regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-accuracy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test evaluation boundaries
        run: npx vitest run src/lib/evaluation --maxWorkers=2
      - name: Replay frozen real cases
        run: npm run eval:auto
      - name: Publish report to job summary
        if: always()
        run: |
          if test -f output/accuracy-eval/automation/latest.md; then
            cat output/accuracy-eval/automation/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Evaluation did not produce a report; inspect the failed step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: card-accuracy-regression
          path: |
            output/accuracy-eval/automation/latest.json
            output/accuracy-eval/automation/latest.md
          retention-days: 14
          if-no-files-found: warn
