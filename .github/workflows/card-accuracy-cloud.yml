name: Daily real card evaluation

on:
  schedule:
    - cron: '0 9 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily acquires the reserved batch; verify replays frozen real observations'
        type: choice
        options: [daily, verify]
        default: daily

permissions:
  contents: read

concurrency:
  group: card-accuracy-cloud
  cancel-in-progress: false

jobs:
  daily:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run bounded cloud evaluation
        env:
          CARD_EVAL_CRON_SECRET: ${{ secrets.CARD_EVAL_CRON_SECRET }}
          CARD_EVAL_MODE: ${{ inputs.mode || 'daily' }}
        run: node scripts/trigger-cloud-card-evaluation.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: daily-card-evaluation
          path: output/accuracy-eval/cloud/
          retention-days: 14
          if-no-files-found: warn
